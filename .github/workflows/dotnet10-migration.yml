name: Build .NET 10 SLNX and preview release

on:
  push:
    branches: [main, migration/net10-slnx]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync upstream and release Windows build']
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'FrostsGen5Editor.Net10.csproj'
      - 'FrostsGen5Editor.slnx'
      - '.github/workflows/dotnet10-migration.yml'
      - '**/*.cs'
      - '**/*.resx'

concurrency:
  group: dotnet10-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/setup-nuget@v2
      - name: Restore legacy binary dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '..\packages'))
          & nuget restore packages.config -PackagesDirectory $packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Legacy package restore failed" }
      - name: .NET 10 solution restore
        run: dotnet restore FrostsGen5Editor.slnx
      - name: Build all projects (.slnx)
        run: dotnet build FrostsGen5Editor.slnx --configuration Release --no-restore
      - name: Validate output
        shell: pwsh
        run: |
          if (-not (Test-Path bin/Release/net10.0-windows/FrostsGen5Editor.dll)) { throw "NET10 DLL missing" }
          if (-not (Test-Path bin/Release/net10.0-windows/FrostsGen5Editor.exe)) { throw "NET10 EXE missing" }
      - name: Publish portable Windows build
        run: dotnet publish FrostsGen5Editor.Net10.csproj -c Release -r win-x64 --self-contained false -o publish/net10
      - name: Launch GUI executable on Windows runner (informational smoke test)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GITHUB_WORKSPACE 'publish/net10/FrostsGen5Editor.exe'
          $folder = Split-Path $exe
          if (-not (Test-Path $exe)) { throw "Published exe missing" }
          # Some hosted runners do not provide an interactive desktop or GPU;
          # a failure here is reported, not treated as proof of a binary regression.
          $p = Start-Process -FilePath $exe -WorkingDirectory $folder -PassThru
          try {
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) {
              throw "GUI exited during startup (exit code $($p.ExitCode)); inspect runtime dependencies."
            }
            Write-Host 'GUI process stayed alive for 8 seconds.'
          }
          finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FrostsGen5Editor-net10-win-x64
          path: publish/net10/
          if-no-files-found: error
      - name: Publish idempotent .NET 10 preview after main/upstream sync
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Only publish preview builds for a revision already published by the stable sync workflow.
          $upstreamSha = (& gh api repos/FrostFalcon/FrostsGen5Editor/commits/main --jq .sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $upstreamSha.Length -lt 12) { throw 'Cannot resolve upstream SHA' }
          $short = $upstreamSha.Substring(0, 12)
          $stableTag = "upstream-$short"
          $previewTag = "net10-preview-$short"
          & gh release view $stableTag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Stable sync release $stableTag has not been published; skipping preview."
            exit 0
          }
          & gh release view $previewTag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Preview $previewTag already exists; no duplicate release."
            exit 0
          }
          $archive = "FrostsGen5Editor-net10-win-x64-preview-$short.zip"
          Compress-Archive -Path 'publish/net10/*' -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path 'NET10-SHA256SUMS' -Value "$hash  $archive" -Encoding ascii
          @"
          Experimental .NET 10 Windows Desktop preview synchronized from FrostFalcon/FrostsGen5Editor.

          Upstream commit: $upstreamSha
          Framework: net10.0-windows (win-x64), framework-dependent.
          Requires .NET 10 Windows Desktop Runtime.

          Build and basic GUI process startup are verified in Actions.
          ROM editing, model/animation preview and ROM save workflows still need functional regression tests.
          Stable .NET Framework 4.8 releases remain available separately.
          "@ | Set-Content -Path 'preview-notes.md' -Encoding utf8
          & gh release create $previewTag $archive 'NET10-SHA256SUMS' `
            --repo $env:GH_REPO --target $env:GITHUB_SHA --prerelease `
            --title "FrostsGen5Editor .NET 10 preview ($short)" --notes-file 'preview-notes.md'
          if ($LASTEXITCODE -ne 0) { throw "Preview release failed: $previewTag" }
      - name: Upload MSBuild diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net10-build-logs
          path: |
            obj/
            bin/
          if-no-files-found: ignore
